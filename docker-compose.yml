services:
  gateway:
    build: .
    image: commerce-gateway-api:local
    ports:
      - '3000:3000'
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      # Override in .env for anything beyond local experiments.
      JWT_SECRET: ${JWT_SECRET:-local-compose-secret-change-me-0123456789}
    restart: unless-stopped
    stop_grace_period: 15s
    read_only: true
    security_opt:
      - no-new-privileges:true
